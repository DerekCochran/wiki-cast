[build-system]
requires = ["setuptools>=61.0.0", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki_cast"
version = "1.0.0"
description = "Wikitext C AST Builder"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]